[project]
name = "fdp"
version = "0.1.0"
description = "Fair Districts Data Platform — shared data management for fairdistrictsga.org apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "fiona>=1.9.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.7.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "census>=0.8.0",
    "rich>=13.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
fdp = "fdp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdp"]
