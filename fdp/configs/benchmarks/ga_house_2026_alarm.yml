# =============================================================================
# Georgia State House Benchmark — ALARM SMC
# 180 districts | 2020 VTD base | 6 elections | redist Sequential Monte Carlo
#
# Same 6-election composite as ga_house_2026_v1.yml; algorithm section uses
# SMC instead of ReCom MCMC.
#
# Run:
#   cd fdga-chain
#   modal run modal_alarm_app.py::build_map --chamber house   # one-time map build
#   modal run modal_alarm_app.py::run_alarm_smc \
#       --run-name fdga_baseline_benchmarks_2601_house_alarm \
#       --chamber house --n-districts 180 --district-col HDIST \
#       --pop-tol 0.01 \
#       --map-rds-path /data/maps/GA_sh_2020_map.rds \
#       --n-chains 10 --nsims 10000
# =============================================================================

benchmark_id: ga_house_2026_alarm
description: "Georgia 180-district State House benchmark — ALARM SMC (redist)"
version: "1.0"

geography:
  state: GA
  geo_level: vtd
  vintage_year: 2020
  # graph_file unused by SMC runner — kept for schema compatibility
  graph_file: fdga-chain/data/graphs/ga_house.json

chamber:
  name: house
  n_districts: 180
  pop_column: TOTPOP
  pop_epsilon: 0.01
  district_col: HDIST

elections:
  - label: gov_2018
    year: 2018
    election_type: general
    office: governor
    partisan_score: true
    competitive: true
  - label: pre_2020
    year: 2020
    election_type: general
    office: president
    partisan_score: true
    competitive: true
  - label: uss_2021_war
    year: 2021
    election_type: runoff
    office: senate
    candidates: [war, loe]
    partisan_score: true
    competitive: true
  - label: gov_2022
    year: 2022
    election_type: general
    office: governor
    partisan_score: true
    competitive: true
  - label: uss_2022
    year: 2022
    election_type: general
    office: senate
    partisan_score: true
    competitive: true
  - label: pre_2024
    year: 2024
    election_type: general
    office: president
    partisan_score: true
    competitive: true

competitiveness:
  thresholds: [0.035, 0.05]
  method: all_independent

demographics:
  cvap_year: 2024
  majority_threshold: 0.50
  groups:
    - name: black
      label: "Majority Black (any-part)"
      cvap_col: CVAP_BLK24
    - name: white
      label: "Majority White"
      cvap_col: CVAP_WHT24
    - name: hispanic
      label: "Majority Hispanic"
      cvap_col: CVAP_HSP24
    - name: minority_coalition
      label: "Majority Minority Coalition"
      formula: "1 - (CVAP_WHT24 / CVAP_TOT24)"

# ── SMC algorithm parameters ──────────────────────────────────────────────────
mcmc:
  algorithm: smc
  nsims: 10000           # plans per chain; 10 chains → 100,000 total
  n_chains: 10
  pop_epsilon: 0.01
  compactness: 1.0
  counties_col: pseudo_county
  random_seed: 42
  save_assignments: true

grading:
  pass_band: [1, 99]
  a_band:    [25, 75]
  b_band:    [10, 90]
  c_band:    [5, 95]
  composite: min

output:
  dir: data/repos/main/ensemble
