# =============================================================================
# Georgia State Senate Benchmark — ALARM SMC
# 56 districts | 2020 VTD base | 6 elections | redist Sequential Monte Carlo
# pop_epsilon: 0.01 (±1%)
#
# Build the redist_map (no local R install needed — runs inside cached Modal image):
#   cd fdga-chain
#   modal run modal_alarm_app.py::build_map --chamber senate
#
# Run:
#   cd fdga-chain
#   modal run modal_alarm_app.py::run_alarm_smc \
#       --run-name fdga_baseline_benchmarks_2601_senate_alarm \
#       --n-chains 10 --nsims 10000
# =============================================================================

benchmark_id: ga_senate_2026_alarm
description: "Georgia 56-district State Senate benchmark — ALARM SMC (redist)"
version: "1.0"

geography:
  state: GA
  geo_level: vtd
  vintage_year: 2020
  graph_file: fdga-chain/data/graphs/ga_senate.json   # GerryChain graph (not used by SMC runner)

chamber:
  name: senate
  n_districts: 56
  pop_column: TOTPOP
  pop_epsilon: 0.01            # ±1%
  district_col: SDIST          # enacted plan column in GA_ss_2020_map.rds

elections:

  - label: gov_2018
    year: 2018
    election_type: general
    office: governor
    partisan_score: true
    competitive: true

  - label: pre_2020
    year: 2020
    election_type: general
    office: president
    partisan_score: true
    competitive: true

  - label: uss_2021_war
    year: 2021
    election_type: runoff
    office: senate
    candidates: [war, loe]
    partisan_score: true
    competitive: true

  - label: gov_2022
    year: 2022
    election_type: general
    office: governor
    partisan_score: true
    competitive: true

  - label: uss_2022
    year: 2022
    election_type: general
    office: senate
    partisan_score: true
    competitive: true

  - label: pre_2024
    year: 2024
    election_type: general
    office: president
    partisan_score: true
    competitive: true

competitiveness:
  thresholds: [0.035, 0.05]
  method: all_independent

demographics:
  cvap_year: 2024
  majority_threshold: 0.50
  groups:
    - name: black
      label: "Majority Black (any-part)"
      cvap_col: CVAP_BLK24
    - name: white
      label: "Majority White"
      cvap_col: CVAP_WHT24
    - name: hispanic
      label: "Majority Hispanic"
      cvap_col: CVAP_HSP24
    - name: minority_coalition
      label: "Majority Minority Coalition"
      formula: "1 - (CVAP_WHT24 / CVAP_TOT24)"

# ── SMC algorithm parameters ──────────────────────────────────────────────────
# algorithm: smc        → redist_smc() from the ALARM/redist R package
# nsims:                → plans per independent chain
# n_chains:             → independent SMC chains run in parallel on Modal
# pop_epsilon:          → population tolerance (0.01 = ±1%)
# compactness:          → redist_smc compactness weight (1.0 = default)
# counties_col:         → redist_map column for county-split constraint
# random_seed:          → base seed; each chain gets seed + chain_idx
mcmc:
  algorithm: smc
  nsims: 10000           # plans per chain; 10 chains → 100,000 total
  n_chains: 10
  pop_epsilon: 0.01
  compactness: 1.0
  counties_col: pseudo_county
  random_seed: 42
  save_assignments: true

grading:
  pass_band: [1, 99]
  a_band:    [25, 75]
  b_band:    [10, 90]
  c_band:    [5, 95]
  composite: min

output:
  dir: fdp/data/repos/main/ensemble
