# =============================================================================
# Georgia Congressional Benchmark — v2
# 14 districts | 2020 VTD base | 6 elections | 10,000 MCMC steps
#
# Changes from v1:
#   - pop_epsilon: 0.02 → 0.01  (±1% — Princeton/MGGG standard for Congress)
#   - competitiveness thresholds: [0.07, 0.10] → [0.05]  (5% win margin; add 0.07 later)
# =============================================================================

benchmark_id: ga_congress_2026_v2
description: "Georgia 14-district congressional benchmark — v2 (1% pop deviation, 5% competitiveness)"
version: "2.0"

geography:
  state: GA
  geo_level: vtd
  vintage_year: 2020
  graph_file: fdga-chain/data/graphs/ga_congress.json   # pre-built dual graph, 2698 nodes

chamber:
  name: congress
  n_districts: 14
  pop_column: TOTPOP
  pop_epsilon: 0.01                  # ±1% — Princeton/MGGG standard for congressional benchmarks
  # Note: if 1% produces too few accepted proposals (slow mixing), relax to 0.015 in v3.

elections:

  - label: gov_2018
    year: 2018
    election_type: general
    office: governor
    partisan_score: true
    competitive: true

  - label: pre_2020
    year: 2020
    election_type: general
    office: president
    partisan_score: true
    competitive: true

  - label: uss_2021_war
    year: 2021
    election_type: runoff
    office: senate
    candidates: [war, loe]
    partisan_score: true
    competitive: true

  - label: gov_2022
    year: 2022
    election_type: general
    office: governor
    partisan_score: true
    competitive: true

  - label: uss_2022
    year: 2022
    election_type: general
    office: senate
    partisan_score: true
    competitive: true

  - label: pre_2024
    year: 2024
    election_type: general
    office: president
    partisan_score: true
    competitive: true

competitiveness:
  thresholds: [0.035, 0.05]         # 7-point margin (±3.5pp) and 10-point margin (±5pp)
  method: all_independent

demographics:
  cvap_year: 2024
  majority_threshold: 0.50
  groups:
    - name: black
      label: "Majority Black (any-part)"
      cvap_col: CVAP_BLK24
    - name: white
      label: "Majority White"
      cvap_col: CVAP_WHT24
    - name: hispanic
      label: "Majority Hispanic"
      cvap_col: CVAP_HSP24
    - name: minority_coalition
      label: "Majority Minority Coalition"
      formula: "1 - (CVAP_WHT24 / CVAP_TOT24)"

mcmc:
  algorithm: recom
  n_steps: 10000
  burn_in: 500                       # 500-step warmup for Congress (14 districts, fast mixing)
  n_chains: 1
  pop_epsilon: 0.01
  random_seed: null
  save_assignments: true

grading:
  pass_band: [1, 99]
  a_band:    [25, 75]
  b_band:    [10, 90]
  c_band:    [5, 95]
  composite: min

output:
  dir: fdp/data/repos/main/ensemble
