# =============================================================================
# Georgia State Senate Benchmark — v1
# 56 districts | 2020 VTD base | 7 elections | 10,000 MCMC steps
# pop_epsilon: 0.01 (±1%)
# competitiveness: 5% win margin (add 7% after seeing distribution)
# =============================================================================

benchmark_id: ga_senate_2026_v1
description: "Georgia 56-district State Senate benchmark for 2026 redistricting process"
version: "1.0"

geography:
  state: GA
  geo_level: vtd
  vintage_year: 2020
  graph_file: fdga-chain/data/graphs/ga_senate.json   # ✅ pre-built, 2698 nodes

chamber:
  name: senate
  n_districts: 56                    # ✅  GA has 56 State Senate districts
  pop_column: TOTPOP
  pop_epsilon: 0.01                  # ±1%

elections:
  - label: gov_2018
    year: 2018
    election_type: general
    office: governor
    partisan_score: true
    competitive: true
  - label: pre_2020
    year: 2020
    election_type: general
    office: president
    partisan_score: true
    competitive: true
  - label: uss_2021_war
    year: 2021
    election_type: runoff
    office: senate
    candidates: [war, loe]
    partisan_score: true
    competitive: true
  - label: gov_2022
    year: 2022
    election_type: general
    office: governor
    partisan_score: true
    competitive: true
  - label: uss_2022
    year: 2022
    election_type: general
    office: senate
    partisan_score: true
    competitive: true
  - label: uss_r22
    year: 2022
    election_type: runoff
    office: senate
    candidates: [war, wal]
    partisan_score: true
    competitive: true
  - label: pre_2024
    year: 2024
    election_type: general
    office: president
    partisan_score: true
    competitive: true

competitiveness:
  thresholds: [0.035, 0.05]         # 7-point margin (±3.5pp) and 10-point margin (±5pp)
  method: all_independent

demographics:
  cvap_year: 2024
  majority_threshold: 0.20
  groups:
    - name: black
      label: "Majority Black (any-part)"
      cvap_col: CVAP_BLK24
    - name: white
      label: "Majority White"
      cvap_col: CVAP_WHT24
    - name: hispanic
      label: "Majority Hispanic"
      cvap_col: CVAP_HSP24
    - name: minority_coalition
      label: "Majority Minority Coalition"
      formula: "1 - (CVAP_WHT24 / CVAP_TOT24)"

mcmc:
  algorithm: recom                   # ❓ TBD — same guidance as congress config
  n_steps: 100000                     # ✅
  burn_in: 10000                      # ❓ TBD — 1000 recommended for 56-district chamber
  # GUIDANCE: State Senate has 56 districts — harder to mix than Congress.
  #   Discard first 1,000 steps as warm-up. Net usable draws: 9,000.
  n_chains: 5                        # ❓ TBD — 1 standard; 5 for convergence diagnostics
  pop_epsilon: 0.01
  random_seed: null
  save_assignments: true

grading:
  pass_band: [1, 99]
  a_band:    [25, 75]                # ❓ TBD — confirm after seeing distribution
  b_band:    [10, 90]
  c_band:    [5, 95]
  composite: min                     # ❓ TBD — see guidance in congress config

output:
  dir: fdp/data/repos/main/ensemble
