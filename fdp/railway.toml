# FDP API — Railway deployment config
#
# Service setup in Railway dashboard:
#   1. New service → "Deploy from GitHub repo"
#   2. Source repo: your fgdp repo
#   3. Root directory: fdp          (so build context = fdp/)
#   4. Railway auto-detects this railway.toml
#
# Required environment variables (set in Railway dashboard):
#   DATABASE_URL    postgresql://postgres.[ref]:password@aws-1-us-east-2.pooler.supabase.com:5432/postgres
#   FDPAPI_SECRET   any random string (protects POST /api/v1/query)
#
# After deploy, verify with:
#   curl https://<service>.up.railway.app/api/v1/health

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn fdp.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
