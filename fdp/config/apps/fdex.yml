# =============================================================================
# fdex — District Explorer (consumer-facing)
# Overrides for defaults.yml where fdex differs from platform defaults.
# =============================================================================

app:
  name: fdex
  description: "District Explorer — consumer-facing redistricting tool"
  repo: main   # Switch to a workspace name to test new data without affecting other apps

map:
  zoom: 5.5
  min_zoom: 4.5
  max_zoom: 12.0

# Plan catalogue: each entry references a file inside the active data repo.
# Path is relative to the repo root (data_layout keys resolved by the platform).
#
# Keep this list aligned with fdex/config/maps.yml — every plan fdex renders
# must appear here, or sync-app leaves fdex/data/ holding a stale copy that
# never picks up newly scored elections (e.g. p24_pct_dem).
plans:
  congress:
    - id: congress_enacted_24
      label: "2024 Enacted Congressional Map"
      file: "boundaries/congress/congress_enacted_24_2024update.geojson"
    - id: congress_enacted_2123
      label: "Congressional Map, 2021–2024"
      file: "boundaries/congress/congress_enacted_2123_2024update.geojson"
    - id: congress_remedy_2
      label: "GHDC & GSDC Congressional Remedy (2023)"
      file: "boundaries/congress/congress_remedy_2.geojson"
  house:
    - id: house_enacted_24
      label: "2024 Enacted House Map"
      file: "boundaries/house/house_enacted_24_2024update.geojson"
    - id: house_enacted_2123
      label: "State House Map, 2021–2024"
      file: "boundaries/house/house_enacted_2123_2024update.geojson"
    - id: house_remedy_2
      label: "GHDC House Remedy (2023)"
      file: "boundaries/house/house_remedy_2.geojson"
    - id: house_prop1_dem
      label: "State House Proposal 1 (Dem)"
      file: "boundaries/house/house_prop1_dem.geojson"
    - id: house_prop2_rep
      label: "State House Proposal 2 (Rep)"
      file: "boundaries/house/house_prop2_rep.geojson"
  senate:
    - id: senate_enacted_24
      label: "2024 Enacted Senate Map"
      file: "boundaries/senate/senate_enacted_24_2024update.geojson"
    - id: senate_enacted_2123
      label: "State Senate Map, 2021–2024"
      file: "boundaries/senate/senate_enacted_2123_2024update.geojson"
    - id: senate_remedy
      label: "Senate Remedy Map"
      file: "boundaries/senate/senate_remedy.geojson"
    - id: senate_remedy_2
      label: "GSDC Senate Remedy (2023)"
      file: "boundaries/senate/senate_remedy_2.geojson"
    - id: senate_prop1_dem
      label: "State Senate Proposal 1 (Dem)"
      file: "boundaries/senate/senate_prop1_dem.geojson"
    - id: senate_prop2_rep
      label: "State Senate Proposal 2 (Rep)"
      file: "boundaries/senate/senate_prop2_rep.geojson"

overlays:
  - id: bvap
    label: "Black VAP %"
    property: "BVAP_PCT"
    color_ramp: ["#f7f7f7", "#084594"]
    breaks: [0, 10, 20, 30, 40, 50, 100]
  - id: hvap
    label: "Hispanic VAP %"
    property: "HVAP_PCT"
    color_ramp: ["#f7f7f7", "#006d2c"]
    breaks: [0, 5, 10, 15, 20, 30, 100]
  - id: avap
    label: "Asian VAP %"
    property: "AVAP_PCT"
    color_ramp: ["#f7f7f7", "#7a0177"]
    breaks: [0, 2, 5, 10, 15, 20, 100]
  - id: partisan
    label: "Partisan Lean"
    property: "DEM_PCT"
    color_ramp: ["#c0392b", "#f7f7f7", "#2980b9"]
    breaks: [0, 40, 45, 50, 55, 60, 100]

reference_layers:
  county: "boundaries/reference/county.geojson"
  places: "boundaries/reference/places_2020data.geojson"

demographics:
  congress: "demographics/congress.json"
  house:    "demographics/house.json"
  senate:   "demographics/senate.json"
