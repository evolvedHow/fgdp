# =============================================================================
# map-compare — Redistricting plan comparison tool
# =============================================================================

app:
  name: map_compare
  description: "Side-by-side redistricting plan comparison with metrics and AI narratives"
  repo: main

map:
  zoom: 6.0

# Plan catalogue — mirrors map-compare/public/data-catalog.json, which is the
# app's own source of truth for its preset library. Every file the catalogue
# lists must appear here, or sync-app leaves a stale copy in public/data/ that
# never picks up rescored elections.
plans:
  congress:
    - id: congress12_census20
      label: "GA Congress — 2012 Plan (2020 Census data)"
      file: "boundaries/congress/congress12_census20.geojson"
    - id: congress21_census20
      label: "GA Congress — 2021 Plan (2020 Census data)"
      file: "boundaries/congress/congress21_census20.geojson"
    - id: congress21_p2
      label: "GA Congress — 2021 Plan v2"
      file: "boundaries/congress/congress21_p2.geojson"
    - id: congress_cooper
      label: "GA Congress — Cooper Remedial Plan"
      file: "boundaries/congress/congress_cooper.geojson"
    - id: congress_enacted_2123_2024update
      label: "GA Congress — Enacted 2021-23 (2024 update)"
      file: "boundaries/congress/congress_enacted_2123_2024update.geojson"
    - id: congress_enacted_24_2024update
      label: "GA Congress — Enacted 2024 (2024 update)"
      file: "boundaries/congress/congress_enacted_24_2024update.geojson"
    - id: congress_proposed3
      label: "GA Congress — Proposed Plan 3"
      file: "boundaries/congress/congress_proposed3.geojson"
    - id: congress_remedy_1
      label: "GA Congress — Remedy Plan 1"
      file: "boundaries/congress/congress_remedy_1.geojson"
    - id: congress_remedy_1_2024update
      label: "GA Congress — Remedy Plan 1 (2024 update)"
      file: "boundaries/congress/congress_remedy_1_2024update.geojson"
    - id: congress_remedy_2
      label: "GA Congress — Remedy Plan 2"
      file: "boundaries/congress/congress_remedy_2.geojson"
    - id: enacted_congress22
      label: "GA Congress — Enacted 2022"
      file: "boundaries/congress/enacted_congress22.geojson"
  senate:
    - id: enacted_senate22
      label: "GA Senate — Enacted 2022"
      file: "boundaries/senate/enacted_senate22.geojson"
    - id: enacted_senate22_2024update
      label: "GA Senate — Enacted 2022 (2024 update)"
      file: "boundaries/senate/enacted_senate22_2024update.geojson"
    - id: senate14_census20
