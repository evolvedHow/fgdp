      label: "GA Senate — Remedy 40% Plan (2024 update)"
      file: "boundaries/senate/senate_remedy_40pct_2024update.geojson"
  house:
    - id: enacted_house22
      label: "GA House — Enacted 2022"
      file: "boundaries/house/enacted_house22.geojson"
    - id: enacted_house22_2024update
      label: "GA House — Enacted 2022 (2024 update)"
      file: "boundaries/house/enacted_house22_2024update.geojson"
    - id: house15_census20
      label: "GA House — 2015 Plan (2020 Census data)"
      file: "boundaries/house/house15_census20.geojson"
    - id: house_enacted_2123_2024update
      label: "GA House — Enacted 2021-23 (2024 update)"
      file: "boundaries/house/house_enacted_2123_2024update.geojson"
    - id: house_enacted_24_2024update
