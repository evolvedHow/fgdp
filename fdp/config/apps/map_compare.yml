    - id: senate_enacted_24_2024update
      label: "GA Senate — Enacted 2024 (2024 update)"
      file: "boundaries/senate/senate_enacted_24_2024update.geojson"
    - id: senate_prop1_dem
      label: "GA Senate — Proposed Plan 1 (Democratic)"
      file: "boundaries/senate/senate_prop1_dem.geojson"
    - id: senate_prop2_rep
      label: "GA Senate — Proposed Plan 2 (Republican)"
      file: "boundaries/senate/senate_prop2_rep.geojson"
    - id: senate_prop3_rep
      label: "GA Senate — Proposed Plan 3 (Republican)"
      file: "boundaries/senate/senate_prop3_rep.geojson"
    - id: senate_remedy
      label: "GA Senate — Remedy Plan"
