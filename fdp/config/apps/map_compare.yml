    - id: house_remedy_2
      label: "GA House — Remedy Plan 2"
      file: "boundaries/house/house_remedy_2.geojson"

reference_layers:
  county: "boundaries/reference/county.geojson"
  places: "boundaries/reference/places_2020data.geojson"

# LLM: map-compare calls AI providers client-side; list supported providers
llm:
  providers:
    - groq
    - anthropic
    - openai
    - google
  default_provider: groq
