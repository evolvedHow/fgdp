# fdworkbench — Railway deployment config
#
# Railway service settings:
#   Root directory  → fdworkbench
#   Builder         → Dockerfile  (auto-detected)
#   Port            → set to 8003 (or Railway auto-assigns via $PORT)
#
# Required environment variables:
#   DATABASE_URL       postgresql://postgres.[ref]:password@aws-1-us-east-2.pooler.supabase.com:5432/postgres
#   LLM_PROVIDER       anthropic/claude-sonnet-4-20250514
#   ANTHROPIC_API_KEY  sk-ant-...
#
# Optional:
#   GROQ_API_KEY        fallback LLM provider
#   WORKBENCH_SECRET    enables POST /api/query/execute for power users

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
