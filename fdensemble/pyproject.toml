[project]
name = "fdensemble"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "matplotlib",
    "python-dotenv",
    "requests",
    "httpx>=0.27.0",       # FDP API client (replaces requests for async support)
    "geopandas>=1.0.0",
    "pyogrio>=0.7.0",
    "pyarrow>=14.0.0",
    "shapely>=2.0.0",
    "fdp",                 # FDP data platform — shared query layer + data dictionary
]

[project.optional-dependencies]
yaml = ["pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

# uv resolves fdp from the local monorepo sibling directory
[tool.uv.sources]
fdp = { path = "../fdp", editable = true }
