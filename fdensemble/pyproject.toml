[project]
name = "fdensemble"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "matplotlib",
    "python-dotenv",
    "requests",
    "geopandas>=1.0.0",
    "pyogrio>=0.7.0",
    "pyarrow>=14.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
